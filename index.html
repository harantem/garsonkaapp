<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Garsónka – Apartment Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f8fa; --card:#ffffff; --ink:#111116; --muted:#6e7178; --line:#e7e9ee;
    --accent:#006aff; --accent-soft:#e6f0ff; --save:#1a8a4c; --save-bg:#e9f6ef; --reject:#d12d2d; --reject-bg:#fdeeee;
    --chip:#f1f3f6; --shadow:0 1px 2px rgba(17,17,22,.04),0 6px 16px rgba(17,17,22,.05); --shadow-lg:0 16px 40px rgba(17,17,22,.12); --ring:0 0 0 3px rgba(0,106,255,.16);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  a{color:inherit}
  .app{display:flex;min-height:100vh}
  /* Sidebar */
  .side{width:260px;flex:0 0 260px;background:#fff;border-right:1px solid var(--line);
        position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 14px;display:flex;flex-direction:column;gap:6px}
  .brand{font-weight:800;font-size:17px;padding:4px 10px 14px;letter-spacing:-.2px;color:var(--accent)}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:3px}
  .navbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;border:none;background:transparent;
          text-align:left;padding:11px 13px;border-radius:11px;cursor:pointer;font-size:14px;font-weight:500;color:var(--ink);width:100%;transition:background .12s ease}
  .navbtn:hover{background:var(--chip)}
  .navbtn.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
  .navbtn .count{background:rgba(17,17,22,.07);border-radius:20px;padding:1px 9px;font-size:12px;font-weight:600}
  .navbtn.active .count{background:rgba(0,106,255,.16);color:var(--accent)}
  .side .learn{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
  .learn h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .learn .tag{display:inline-block;background:var(--reject-bg);color:var(--reject);border-radius:20px;
              padding:3px 9px;font-size:11px;margin:0 4px 4px 0}
  .learn .empty{color:var(--muted);font-size:12px}
  .resetbtn{margin-top:10px;font-size:11px;color:var(--muted);background:none;border:none;cursor:pointer;text-decoration:underline;padding:4px}
  /* Main */
  .main{flex:1;padding:22px 26px;max-width:1180px}
  .head{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .head h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.3px}
  .head .sub{color:var(--muted);font-size:13px}
  .syncbar{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:20px;background:var(--chip);color:var(--muted)}
  .syncbar.ok{background:var(--save-bg);color:var(--save)}
  .syncbar.warn{background:#fff4e5;color:#b45309}
  .empty-feed{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:48px;text-align:center;color:var(--muted)}
  /* Card */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
        margin-bottom:16px;overflow:hidden;display:grid;grid-template-columns:260px 1fr 300px;transition:box-shadow .16s ease,transform .16s ease}
  .card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
  .card.removing{opacity:0;transform:translateY(-6px);transition:.25s}
  .ph{position:relative;background:linear-gradient(135deg,#e7ebf2,#d7deea);min-height:210px}
  .ph .photolink{position:absolute;inset:0;z-index:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
                 gap:6px;text-decoration:none;color:#41506b}
  .ph .photolink .cam{font-size:30px;opacity:.85}
  .ph .photolink .lab{font-weight:600;font-size:13px}
  .ph .photolink .lab small{display:block;font-weight:500;color:#7b889d;font-size:11px;margin-top:2px}
  .ph .photolink:hover .lab{text-decoration:underline}
  .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1;background:#d7deea}
  .ph .price{position:absolute;left:12px;bottom:12px;background:rgba(17,17,22,.9);color:#fff;
             padding:7px 12px;border-radius:11px;font-weight:800;font-size:16px;letter-spacing:-.2px;z-index:2;backdrop-filter:saturate(140%) blur(2px)}
  .ph-photos{position:absolute;right:12px;bottom:12px;z-index:2;background:rgba(17,17,22,.78);color:#fff;text-decoration:none;
             font-size:11px;font-weight:600;padding:6px 9px;border-radius:9px;backdrop-filter:saturate(140%) blur(2px);white-space:nowrap}
  .ph-photos:hover{background:rgba(17,17,22,.92)}
  .ph .badge{position:absolute;left:12px;top:12px;background:#fff;color:var(--ink);border-radius:7px;
             padding:3px 8px;font-size:11px;font-weight:600;box-shadow:var(--shadow);z-index:2}
  .body{padding:16px 18px;min-width:0}
  .body h3{margin:0 0 6px;font-size:16px;font-weight:700;letter-spacing:-.2px;line-height:1.32}
  .body h3 a{text-decoration:none}
  .body h3 a:hover{text-decoration:underline}
  .addr{color:var(--muted);margin-bottom:12px;font-size:13px}
  .addrlink{color:inherit;text-decoration:none}
  .addrlink:hover{text-decoration:underline;color:var(--accent)}
  .facts{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-bottom:12px}
  .fact{display:flex;flex-direction:column}
  .fact .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
  .fact .v{font-weight:600}
  .yes{color:var(--save)} .no{color:var(--reject)}
  .actions{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:stretch}
  .btn{border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:background .14s ease,box-shadow .14s ease,transform .05s ease}
  .btn:active{transform:translateY(1px)}
  .btn-save{background:var(--save-bg);color:var(--save)}
  .btn-save:hover{background:#d5efdd}
  .btn-reject{background:var(--reject-bg);color:var(--reject)}
  .btn-reject:hover{background:#fbddd9}
  .btn.activeState{outline:2px solid currentColor;outline-offset:-2px}
  .btn-undo{background:var(--chip);color:var(--ink)}
  .reason{flex:1 1 200px;min-width:180px;display:flex;flex-direction:column}
  .reason label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}
  .reason textarea{width:100%;flex:1;border:1px solid var(--line);border-radius:9px;padding:7px 10px;
                   font:inherit;resize:vertical;min-height:34px;background:#fff}
  .reason textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
  .reason .saved{color:var(--save);font-size:11px;margin-top:2px;height:12px}
  .mapwrap{border-left:1px solid var(--line);min-height:210px;position:relative;background:#eef1f5}
  .mapwrap iframe{width:100%;height:100%;border:0;display:block}
  .statetag{position:absolute;right:12px;top:12px;z-index:2;border-radius:7px;padding:3px 9px;font-size:11px;font-weight:700}
  .statetag.saved{background:var(--save);color:#fff}
  .statetag.rejected{background:var(--reject);color:#fff}
  @media(max-width:1000px){
    .card{grid-template-columns:1fr}
    .ph img{min-height:200px}
    .mapwrap{border-left:none;border-top:1px solid var(--line);height:240px}
  }
  @media(max-width:680px){ .side{display:none} }
  /* Photo + map-tab additions */
  .btn-photos{background:var(--chip);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
  .btn-photos:hover{background:#e2e6ec}
  .topbar{display:flex;gap:20px;align-items:flex-start;margin-bottom:8px}
  .topbar .head{flex:1;margin-bottom:0}
  /* Map now lives in the left sidebar, under the All tab */
  .sidemap-label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:14px 2px 6px}
  #mapview{width:100%;height:230px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#eef1f5}
  .ph .price small{display:block;font-weight:500;font-size:10px;opacity:.85;margin-top:-2px;letter-spacing:.5px}
  .fact .v.big{color:var(--accent);font-size:15px}
  .addr .added{color:var(--muted)}
  .sortsel{font:inherit;font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
  .bench{margin-top:4px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:9px;display:inline-block;line-height:1.3}
  .bench.cheap{background:var(--save-bg);color:var(--save)}
  .bench.pricey{background:#fff4e5;color:#b45309}
  .bench.neutral{background:var(--chip);color:var(--muted)}
  .bench .cheap{color:var(--save)} .bench .pricey{color:#b45309} .bench .neutral{color:var(--muted)}
  .dealbadge{position:absolute;right:12px;top:12px;z-index:3;background:linear-gradient(135deg,#f97316,#ef4444);color:#fff;
             padding:4px 9px;border-radius:7px;font-size:11px;font-weight:700;box-shadow:var(--shadow)}
  .card.deal{outline:2px solid #f97316;outline-offset:-2px}
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
  .filters input,.filters select{font:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);transition:border-color .12s ease,box-shadow .12s ease}
  .filters input:focus,.filters select:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
  .filters input[type=number]{width:118px}
  .filters .f-text{flex:1;min-width:200px}
  .filters .f-check{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;white-space:nowrap}
  .filters .f-clear{cursor:pointer;background:var(--chip);border:none;border-radius:8px;padding:8px 13px;font-size:13px;color:var(--ink)}
  .filters .f-clear:hover{background:#e2e6ec}
  .filters .f-range{display:inline-flex;align-items:center;gap:4px}
  .filters .f-range b{color:var(--muted)}
  .filters .f-range input[type=number]{width:120px}
  .presetbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin:-6px 2px 12px}
  .presetbar .pb-label{font-weight:700;color:var(--ink)}
  .presetbar select,.presetbar .pb-btn{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
  .presetbar .pb-btn:hover{background:#f4f5f7}
  .resultcount{font-size:13px;font-weight:600;color:var(--muted);margin:-6px 2px 14px}
  .resultcount b{color:var(--accent)}
  .pin-pop{font-size:13px;min-width:170px}
  .pin-pop b{display:block;margin-bottom:2px}
  .pin-pop .pp-price{color:var(--accent);font-weight:700}
  .pin-pop a{color:var(--accent);text-decoration:none}
  .pin-pop img{width:100%;height:90px;object-fit:cover;border-radius:6px;margin:6px 0;background:#d7deea}
  /* Edit lock / login-to-edit */
  .editbtn{font:inherit;font-size:12px;font-weight:700;padding:7px 13px;border-radius:20px;border:1px solid var(--line);
           background:#fff;color:var(--accent);cursor:pointer;white-space:nowrap}
  .editbtn:hover{background:var(--accent-soft)}
  .editbtn.on{background:var(--save-bg);color:var(--save);border-color:transparent}
  body.locked .btn-save,body.locked .btn-reject,body.locked .btn-undo{opacity:.5}
  body.locked .reason textarea{background:#f7f8fa;cursor:pointer}
  /* Learned-locations chips */
  #learned-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
  #learned-chips .empty{color:var(--muted);font-size:12px}
  .bchip{display:inline-flex;align-items:center;gap:5px;background:var(--reject-bg);color:var(--reject);border-radius:20px;padding:3px 6px 3px 11px;font-size:11px;font-weight:600}
  .bchip button{border:none;background:rgba(180,35,24,.16);color:var(--reject);width:16px;height:16px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
  .bchip button:hover{background:rgba(180,35,24,.34)}
  .block-note{color:var(--muted);font-size:11px;margin-top:7px;line-height:1.35}
  .learn .tag{cursor:pointer}
  /* Statistics & Archive pages */
  .stats-wrap{max-width:860px}
  .stat-sub{color:var(--muted);font-size:12px;margin-bottom:14px}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
  .stat .sv{font-size:22px;font-weight:800;color:var(--accent);line-height:1.1}
  .stat .sl{font-size:12px;color:var(--ink);margin-top:5px;font-weight:600}
  .stat .ss{font-size:11px;color:var(--muted);margin-top:2px}
  .stat-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px}
  .stat-card h3{margin:0 0 4px;font-size:15px}
  .pie-row{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-top:8px}
  .legend{font-size:13px;display:flex;flex-direction:column;gap:6px}
  .legend .dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:middle}
  .bars{margin-top:10px;display:flex;flex-direction:column;gap:7px}
  .bar-row{display:flex;align-items:center;gap:10px;font-size:13px}
  .bar-row .bn{width:140px;flex:0 0 140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-row .bb{flex:1;background:var(--chip);border-radius:6px;height:14px;overflow:hidden}
  .bar-row .bf{display:block;height:100%;background:var(--accent);border-radius:6px}
  .bar-row .bc{width:26px;text-align:right;color:var(--muted);font-weight:700}
  table.ovn{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
  table.ovn th,table.ovn td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  table.ovn th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  table.ovn td:first-child{font-weight:700}
  svg.trend text.ax{font-size:10px;fill:var(--muted)}
  .muted{color:var(--muted);font-size:13px;padding:6px 0}
  .arch-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .arch-btns{display:flex;gap:8px}
  .arch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .arch-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  .ac-img{height:130px;background:#d7deea center/cover no-repeat}
  .ac-body{padding:11px 13px}
  .ac-price{font-weight:800;color:var(--accent)}
  .ac-t{font-size:13px;margin:3px 0;line-height:1.3}
  .ac-t a{text-decoration:none}
  .ac-meta{font-size:12px;color:var(--muted)}
  .ac-when{font-size:11px;color:var(--muted);margin-top:5px}
  .pf-l{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:10px 0 4px}
  .pf-in{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
  .pf-in:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}

  /* ===== Mobile-only elements (hidden on desktop) ===== */
  .mobnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:1200;
          background:rgba(255,255,255,.96);backdrop-filter:saturate(160%) blur(10px);
          border-top:1px solid var(--line);padding:6px 4px calc(5px + env(safe-area-inset-bottom))}
  .mobnav-btn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;
              border:none;background:transparent;cursor:pointer;color:var(--muted);font:inherit;font-weight:600;
              padding:5px 2px;border-radius:10px}
  .mobnav-btn .ic{font-size:18px;line-height:1}
  .mobnav-btn .lb{font-size:9.5px;letter-spacing:-.2px;white-space:nowrap}
  .mobnav-btn.active{color:var(--accent)}
  .mobnav-btn .mcount{position:absolute;top:1px;left:50%;transform:translateX(3px);
              background:var(--accent);color:#fff;font-size:9px;font-weight:700;line-height:1;
              padding:2px 5px;border-radius:20px}
  .mobfilter-toggle{display:none}

  /* ===== Phone layout ===== */
  @media(max-width:680px){
    body{font-size:15px}
    .app{display:block}
    .main{flex:none;max-width:none;padding:14px 13px calc(74px + env(safe-area-inset-bottom))}
    .topbar{margin-bottom:8px}
    .head{gap:7px 10px;align-items:center}
    .head h1{font-size:19px;flex:1 1 100%;order:1}
    .head .sub{flex:1 1 100%;order:5;font-size:12px}
    .editbtn{order:2;margin-left:auto}
    #sortsel{order:3}
    .syncbar{order:4;margin-left:0}

    /* collapsible filters + presets */
    .mobfilter-toggle{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
            font:inherit;font-size:14px;font-weight:600;padding:12px;margin-bottom:12px;cursor:pointer;
            border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--accent);box-shadow:var(--shadow)}
    .filters{display:none;flex-direction:column;align-items:stretch;gap:9px;padding:12px;margin-bottom:12px}
    body.filters-open .filters{display:flex}
    .filters .f-text{min-width:0;width:100%}
    .filters input,.filters select{font-size:16px}            /* 16px stops iOS auto-zoom on focus */
    .filters input[type=number]{width:100%}
    .filters .f-range{display:flex;width:100%;gap:6px}
    .filters .f-range input[type=number]{flex:1;width:auto}
    .filters .f-check{padding:4px 0}
    .filters .f-clear{width:100%;padding:12px}
    .presetbar{display:none;flex-direction:column;align-items:stretch;gap:8px;margin:0 0 12px}
    body.filters-open .presetbar{display:flex}
    .presetbar .pb-label{margin-bottom:2px}
    .presetbar select,.presetbar .pb-btn{width:100%;padding:11px;font-size:14px}

    /* cards stack (the 1000px rule already does columns; tighten for phones) */
    .card{border-radius:14px;margin-bottom:13px}
    .card:hover{transform:none}
    .ph{min-height:200px}
    .body{padding:14px 15px}
    .reason{flex:1 1 100%;min-width:0}
    .reason textarea{font-size:16px}
    .actions{gap:8px}
    .actions .btn{flex:1 1 calc(50% - 4px);padding:12px;font-size:14px;text-align:center}
    .actions .btn-undo{flex:1 1 100%}
    .mapwrap{display:none}                 /* no map on phones — address links to Google Maps instead */

    .mobnav{display:flex}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Garsonka app<small>Bratislava · Staré Mesto · prenájom</small></div>
    <button class="navbtn active" data-tab="new">🆕 New to review <span class="count" id="c-new">0</span></button>
    <button class="navbtn" data-tab="saved">♥ Saved <span class="count" id="c-saved">0</span></button>
    <button class="navbtn" data-tab="rejected">✕ Rejected <span class="count" id="c-rejected">0</span></button>
    <button class="navbtn" data-tab="all">All <span class="count" id="c-all">0</span></button>
    <button class="navbtn" data-tab="stats">📊 Statistics</button>
    <button class="navbtn" data-tab="archive">🗄 Archive <span class="count" id="c-archive">0</span></button>
    <div class="sidemap-label">📍 Walkable area · 15 min</div>
    <div id="mapview"></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="head">
        <h1 id="tab-title">New to review</h1>
        <span class="sub" id="tab-sub"></span>
        <select class="sortsel" id="sortsel" title="Sort listings">
          <option value="price">↕ Price (low→high)</option>
          <option value="date">↕ Newest first</option>
          <option value="m2">↕ €/m² (low→high)</option>
        </select>
        <span class="syncbar" id="syncbar">◌ starting…</span>
      </div>
    </div>
    <button class="mobfilter-toggle" id="mobFilterToggle" aria-expanded="false" onclick="document.body.classList.toggle('filters-open');this.setAttribute('aria-expanded',document.body.classList.contains('filters-open'))">🔎 Filters &amp; presets</button>
    <div class="filters">

    var w=words.slice(j,j+=16),oh=hash; hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);

/* ===== Auto-learn rejected locations from the reasons YOU write =====
   A word counts as a location only if it appears in BOTH your reason and the
   listing's own title/address/street — so "too far Blumental" learns "blumental",
   while "too expensive" or "too small" learn nothing. Learn by exact word, then
   block by substring (so "blumental" also catches "Blumentálska"). */
function learnedBlocks(){
  const set=new Set();
  LISTINGS.forEach(l=>{
    if(statusOf(l.id)!=="rejected") return;
    const reason=reasonOf(l.id);
    if(!reason || reason.trim().startsWith("🤖")) return;   // learn only from reasons you typed, not auto ones
    const rt=_ltok(reason); if(!rt.length) return;
    const loc=new Set(_ltok((l.title||"")+" "+(l.address||"")+" "+(l.street||"")));
    rt.forEach(w=>{ if(loc.has(w)) set.add(w); });
  });
  const ign=new Set(learnIgnore.map(fold));
  return [...set].filter(w=>!ign.has(fold(w)));
}
function matchedLearned(l){
  const blocks=learnedBlocks(); if(!blocks.length) return [];
  const hay=fold((l.title||"")+" "+(l.address||"")+" "+(l.street||""));
  return blocks.filter(w=>hay.indexOf(w)>=0);
}
function applyLearned(){
  const blocks=learnedBlocks(); if(!blocks.length) return 0;
  const changed=[];
  LISTINGS.forEach(l=>{
    if(statusOf(l.id)!=="new") return;            // never touch saved or already-decided listings
    const m=matchedLearned(l);
    if(m.length){ state[l.id]={status:"rejected", reason:"🤖 learned: "+m.join(", ")}; changed.push(l.id); }
  });
  if(changed.length){
    saveState();
    if(sb){ changed.forEach(id=>{ sb.from("apartments")
      .update({status:"rejected", reason:state[id].reason, updated_at:new Date().toISOString()}).eq("id",id)
      .then(()=>{}, e=>console.error(e)); }); }
  }
  return changed.length;
}
function renderLearned(){
  const box=document.getElementById("learned-chips"); if(!box) return;
  const blocks=learnedBlocks();
  box.innerHTML = blocks.length
    ? blocks.map(w=>`<span class="bchip">${esc(w)}<button title="stop auto-rejecting this" onclick="unlearn('${esc(w)}')">×</button></span>`).join("")
    : '<span class="empty">Nothing learned yet — reject a flat and name its location in the reason.</span>';
}
function unlearn(w){
  if(!canEdit() && !unlock()) return;
  if(!learnIgnore.some(x=>fold(x)===fold(w))) learnIgnore.push(w);
  saveLearnIgnore(); renderLearned(); render();
}
function applyFilters(list){
  const f=filters;
  return list.filter(l=>{
    if(f.text){ const hay=((l.title||"")+" "+(l.street||"")+" "+(l.address||"")+" "+(l.buildType||"")+" "+(l.rooms||"")).toLowerCase();
      if(!f.text.toLowerCase().split(/\s+/).every(w=>hay.includes(w))) return false; }
    if(f.street && fold(l.street)!==fold(f.street)) return false;
    if(f.minprice && totalPrice(l) < +f.minprice) return false;

    if(f.maxm2){ const m=perM2(l); if(m!=null && m > +f.maxm2) return false; }
    if(f.minarea && (+l.area||0) < +f.minarea) return false;
    if(f.maxarea && (+l.area||1e9) > +f.maxarea) return false;
    if(f.minfloor){ if(l.floorNum==null || +l.floorNum < +f.minfloor) return false; }
    if(f.maxfloor){ if(l.floorNum==null || +l.floorNum > +f.maxfloor) return false; }

}

let STATS=null;
function buildStats(){
  const all=[], byStreet={}, ac=[];
  LISTINGS.forEach(l=>{ const m=perM2(l); if(m==null) return; const e={id:l.id,m};
    all.push(e); const k=fold(l.street); (byStreet[k]=byStreet[k]||[]).push(e); if(l.hasAc) ac.push(e); });
  STATS={all, byStreet, ac};
}
function benchmark(l){
  const m=perM2(l); if(m==null||!STATS) return null;
  const others = arr => (arr||[]).filter(e=>e.id!==l.id).map(e=>e.m);
  const streetArr = others(STATS.byStreet[fold(l.street)]);
  let pool, label;
  if(streetArr.length>=1){ pool=streetArr; label=streetArr.length+(streetArr.length>1?" others":" other")+" on "+esc((l.street||"").split(",")[0]); }
  else { pool=others(STATS.all); label="area median ("+pool.length+")"; }
  if(!pool.length) return null;
  const ref=median(pool); if(ref==null||!isFinite(ref)||ref===0) return null;
  const pct=Math.round((m-ref)/ref*100);
  let acPct=null, acN=0;
  if(l.hasAc){ const acArr=others(STATS.ac); if(acArr.length>=1){ acN=acArr.length; const r=median(acArr); if(r) acPct=Math.round((m-r)/r*100); } }
  return {pct, label, acPct, acN};
}

}

const STOP=new Set("the a an and or to of in on is it too very i its with no not for from byt this that".split(" "));
function updateLearn(){
  const words={};
  LISTINGS.forEach(l=>{
    if(statusOf(l.id)==="rejected"){
      reasonOf(l.id).toLowerCase().split(/[^a-zà-ž0-9áäčďéíľĺňóôŕšťúýž]+/i).forEach(w=>{
        if(w.length>2 && !STOP.has(w)) words[w]=(words[w]||0)+1;

const NEW_PROJECTS=["skypark","sky park","metropolis","panorama","eurovea"];
function isNewFlat(l){ const t=fold((l.title||"")+" "+(l.address||"")); return NEW_PROJECTS.some(p=>t.indexOf(p)>=0); }
function _avg(a){ return a.length? a.reduce((x,y)=>x+y,0)/a.length : null; }
function r1(v){ return (v==null||!isFinite(v))?null:Math.round(v*10)/10; }
function pct(a,b){ return b? Math.round(a/b*100)+"%" : "0%"; }
function computeStats(){
  const L=LISTINGS, m2=[],sizes=[],totals=[],utils=[]; let ac=0,nac=0; const sc={};
  L.forEach(l=>{ const mm=perM2(l); if(mm!=null&&isFinite(mm)) m2.push(mm);
    const a=+l.area; if(a) sizes.push(a); totals.push(totalPrice(l));
    if(l.hasAc) ac++; else nac++;
    if(!l.energiesIncluded && l.energie!=null && l.energie!=="") utils.push(+l.energie||0);
    const s=(l.street||"").split(",")[0].trim()||"—"; sc[s]=(sc[s]||0)+1; });
  const grp=pred=>{ const g=L.filter(pred); const gm=g.map(perM2).filter(x=>x!=null&&isFinite(x)); return {n:g.length, price:_avg(g.map(totalPrice)), m2:_avg(gm)}; };
  return { n:L.length, avgM2:_avg(m2), minM2:m2.length?Math.min.apply(0,m2):null, maxM2:m2.length?Math.max.apply(0,m2):null,
    avgSize:_avg(sizes), avgTotal:_avg(totals), avgUtil:_avg(utils), utilN:utils.length, ac, nac,
    topStreets:Object.entries(sc).sort((a,b)=>b[1]-a[1]).slice(0,8),
    oldG:grp(l=>!isNewFlat(l)), newG:grp(l=>isNewFlat(l)) };
}
function pieSVG(parts){
  const total=parts.reduce((s,p)=>s+p.value,0); if(total<=0) return '<div class="muted">No data</div>';
  const cx=70,cy=70,r=58; let a0=-Math.PI/2,out=""; const full=parts.find(p=>p.value===total);
  if(full){ out='<circle cx="70" cy="70" r="58" fill="'+full.color+'"/>'; }
  else parts.forEach(p=>{ if(!p.value) return; const f=p.value/total,a1=a0+f*2*Math.PI,lg=f>0.5?1:0;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    out+='<path d="M70,70 L'+x0.toFixed(1)+','+y0.toFixed(1)+' A58,58 0 '+lg+' 1 '+x1.toFixed(1)+','+y1.toFixed(1)+' Z" fill="'+p.color+'"/>'; a0=a1; });
  return '<svg viewBox="0 0 140 140" width="148" height="148">'+out+'</svg>';
}
function trendSVG(rows, metric){
  const dates=[...new Set(rows.map(r=>r.snap_date))].sort();
  const valOf=r=> metric==="price"? r.avg_price : r.avg_m2;
  const groups=[["old","#8a8f98"],["new","#006aff"]];
  const series=groups.map(([g,c])=>({g,c,pts:dates.map(d=>{const r=rows.find(x=>x.snap_date===d&&x.grp===g); return r&&valOf(r)!=null? +valOf(r):null;})}));
  const all=series.flatMap(s=>s.pts).filter(v=>v!=null);
  if(all.length<1) return '<div class="muted">No snapshots yet — this fills in over the next days.</div>';
  if(dates.length<2) return '<div class="muted">First snapshot saved for '+dates[0]+'. The trend line appears once there are at least two days of data.</div>';
  const mn=Math.min.apply(0,all),mx=Math.max.apply(0,all),pad=(mx-mn)*0.12||1,lo=mn-pad,hi=mx+pad;
  const W=580,H=220,LF=46,RF=14,TF=14,BF=30,iw=W-LF-RF,ih=H-TF-BF;
  const X=i=>LF+iw*i/(dates.length-1), Y=v=>TF+ih-(v-lo)/(hi-lo)*ih;
  let g='<line x1="'+LF+'" y1="'+TF+'" x2="'+LF+'" y2="'+(TF+ih)+'" stroke="#e6e8ec"/><line x1="'+LF+'" y1="'+(TF+ih)+'" x2="'+(W-RF)+'" y2="'+(TF+ih)+'" stroke="#e6e8ec"/>';
  [lo,(lo+hi)/2,hi].forEach(v=>{const yy=Y(v); g+='<line x1="'+LF+'" y1="'+yy.toFixed(1)+'" x2="'+(W-RF)+'" y2="'+yy.toFixed(1)+'" stroke="#f1f2f4"/><text class="ax" x="'+(LF-6)+'" y="'+(yy+3).toFixed(1)+'" text-anchor="end">'+v.toFixed(0)+'</text>';});
  g+='<text class="ax" x="'+X(0)+'" y="'+(TF+ih+18)+'" text-anchor="middle">'+dates[0]+'</text><text class="ax" x="'+X(dates.length-1)+'" y="'+(TF+ih+18)+'" text-anchor="middle">'+dates[dates.length-1]+'</text>';
  series.forEach(s=>{ const pts=s.pts.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
    if(pts.length>1) g+='<polyline fill="none" stroke="'+s.c+'" stroke-width="2" points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(" ")+'"/>';
    pts.forEach(p=>g+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="'+s.c+'"/>'); });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" class="trend">'+g+'</svg>';
}

  let h='<div class="stats-wrap"><div class="arch-head"><div class="stat-sub">Across all '+s.n+' flats tracked in your 15-min area.</div><button class="pb-btn" onclick="tab=\'archive\';render();window.scrollTo({top:0});">🗄 Open Archive</button></div><div class="stat-grid">';

  h+='<div class="stat-card"><h3>Price trend over time</h3><div class="stat-sub">Avg €/m² per day — old vs new-build.</div><div id="trend-box"><div class="muted">Loading…</div></div><div class="legend" style="flex-direction:row;gap:16px;margin-top:8px"><div><span class="dot" style="background:#8a8f98"></span> Old</div><div><span class="dot" style="background:#006aff"></span> New-build</div></div></div>';

    .catch(()=>{ const el=document.getElementById("trend-box"); if(el) el.innerHTML='<div class="muted">History needs a one-time setup: run <b>stats_setup.sql</b> in Supabase, then a point is recorded each day.</div>'; });
}
async function snapshotToday(){
  if(!sb) throw new Error("no sb");
  const s=computeStats(), today=new Date().toISOString().slice(0,10);
  const rows=[{snap_date:today,grp:"all",avg_price:r1(s.avgTotal),avg_m2:r1(s.avgM2),avg_size:r1(s.avgSize),n:s.n},
    {snap_date:today,grp:"old",avg_price:r1(s.oldG.price),avg_m2:r1(s.oldG.m2),avg_size:null,n:s.oldG.n},
    {snap_date:today,grp:"new",avg_price:r1(s.newG.price),avg_m2:r1(s.newG.m2),avg_size:null,n:s.newG.n}];
  const { error }=await sb.from("stats_snapshots").upsert(rows,{onConflict:"snap_date,grp"});
  if(error) throw error;
}
async function loadSnapshots(){ if(!sb) return []; const { data, error }=await sb.from("stats_snapshots").select("*").order("snap_date",{ascending:true}); if(error) throw error; return data||[]; }
/* ----- Archive ----- */
function loadArchive(){ try{ return JSON.parse(localStorage.getItem("garsonka_archive"))||{}; }catch(e){ return {}; } }
function saveArchiveStore(a){ localStorage.setItem("garsonka_archive", JSON.stringify(a)); }
function syncArchive(){
  const a=loadArchive(); let ch=false; const today=new Date().toISOString().slice(0,10);
  LISTINGS.forEach(l=>{ if(statusOf(l.id)==="saved" && !a[l.id]){ a[l.id]={id:l.id,title:l.title,street:l.street,address:l.address,price:l.price,total:totalPrice(l),area:l.area,pricePerM2:r1(perM2(l)),floor:l.floor,lift:!!l.lift,hasAc:!!l.hasAc,url:l.url,image:PHOTO_BASE+l.id+".webp",archivedAt:today}; ch=true; } });
  if(ch) saveArchiveStore(a); return a;
}
function renderArchive(feed){
  const items=Object.values(syncArchive()).sort((x,y)=>(x.total||0)-(y.total||0));
  let h='<div class="stats-wrap"><div class="arch-head"><div class="stat-sub">'+items.length+' saved flat'+(items.length===1?"":"s")+' archived — kept even if they leave the market.</div><div class="arch-btns"><button class="pb-btn" onclick="exportArchive(\'csv\')">⬇ Export CSV</button><button class="pb-btn" onclick="exportArchive(\'json\')">⬇ Export JSON</button></div></div>';
  if(!items.length){ feed.innerHTML=h+'<div class="empty-feed">Nothing archived yet. Save a flat (♥) and it is preserved here.</div></div>'; return; }
  h+='<div class="arch-grid">';
  items.forEach(function(l){ h+='<div class="arch-card"><div class="ac-img" style="background-image:url(\''+esc(l.image)+'\')"></div><div class="ac-body"><div class="ac-price">'+(l.total||l.price)+' €/mo</div><div class="ac-t"><a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.title||"")+'</a></div><div class="ac-meta">📍 '+esc(l.street||"")+' · '+esc(l.area||"?")+' m² · '+(l.pricePerM2!=null?esc((""+l.pricePerM2).replace(".",","))+" €/m²":"—")+'</div><div class="ac-when">saved '+esc(l.archivedAt||"")+'</div></div></div>'; });
  feed.innerHTML=h+'</div></div>';
}
function exportArchive(fmt){
  const items=Object.values(loadArchive()); let blob,name;
  if(fmt==="json"){ blob=new Blob([JSON.stringify(items,null,2)],{type:"application/json"}); name="garsonka-saved.json"; }
  else { const cols=["id","title","street","address","total","price","area","pricePerM2","floor","lift","hasAc","url","archivedAt"];
    const q=v=>{ v=(v==null?"":String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
    const csv=[cols.join(",")].concat(items.map(o=>cols.map(c=>q(o[c])).join(","))).join("\n");
    blob=new Blob([csv],{type:"text/csv;charset=utf-8"}); name="garsonka-saved.csv"; }
  const u=URL.createObjectURL(blob),a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1500);
}

document.querySelectorAll(".navbtn").forEach(b=>{
  b.addEventListener("click",()=>{ tab=b.dataset.tab; render(); window.scrollTo({top:0,behavior:"smooth"}); });
});
/* Mobile bottom tab bar — same tabs, thumb-friendly */
document.querySelectorAll(".mobnav-btn").forEach(b=>{
  b.addEventListener("click",()=>{ tab=b.dataset.tab; render(); window.scrollTo({top:0,behavior:"smooth"}); });
});
const _sortsel=document.getElementById("sortsel"); _sortsel.value=sortBy;
_sortsel.addEventListener("change",e=>{ sortBy=e.target.value; localStorage.setItem("garsonka_sort",sortBy); render(); });
const _resetEl=document.getElementById("reset"); if(_resetEl) _resetEl.addEventListener("click",async ()=>{
  if(!canEdit() && !unlock()) return;
  if(confirm("Clear all saved/rejected and reasons?")){
    const ids=Object.keys(state); state={}; saveState(); render();
    if(sb){ try{ await sb.from("apartments").update({status:"new", reason:""}).in("id", ids.length?ids:["__none__"]); }catch(e){ console.error(e); } }
  }
});
init();
</script>
